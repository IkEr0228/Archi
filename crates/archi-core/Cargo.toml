[package]
name = "archi-core"
version = "0.5.0"
edition = "2021"
description = "Archi archive engine, independent of desktop UI"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.4", default-features = false, features = ["deflate", "aes-crypto"] }
tar = "0.4"
flate2 = { version = "1", features = ["zlib-rs"] }
bzip2 = "0.5"
xz2 = "0.1"
sevenz-rust2 = { path = "../../vendor/sevenz-rust2", version = "0.21", default-features = false, features = ["compress", "util", "aes256"] }
ahash = { version = "0.8", default-features = false, features = ["std"] }
unrar = "0.5.8"

[target.'cfg(windows)'.dependencies]
unrar_sys = "=0.5.8"
