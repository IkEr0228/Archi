name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Rustfmt
        run: |
          cargo fmt --manifest-path crates/archi-core/Cargo.toml -- --check
          cargo fmt --manifest-path crates/archi-worker/Cargo.toml -- --check

      - name: Rust workspace tests
        run: cargo test --workspace --locked --lib --bins --tests

      - name: JavaFX tests and smoke
        shell: pwsh
        run: .\desktop-javafx\build.ps1 -Test -Smoke
